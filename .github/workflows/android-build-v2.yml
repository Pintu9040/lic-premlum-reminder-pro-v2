name: Android Build V2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate google-services.json (Optional)
        run: |
          echo "=== Checking Firebase Configuration ==="
          FILE=""
          if [ -f "app/google-services.json" ]; then
            FILE="app/google-services.json"
          elif [ -f "app/src/main/google-services.json" ]; then
            FILE="app/src/main/google-services.json"
          elif [ -f "google-services.json" ]; then
            FILE="google-services.json"
          fi

          if [ -z "$FILE" ]; then
            echo "::warning::google-services.json was not found. Skipping Firebase validation."
          else
            echo "Found google-services.json at $FILE"

            python3 -c "
          import json, sys
          try:
              with open('$FILE', 'r') as f:
                  data = json.load(f)
              if 'project_info' not in data or 'client' not in data:
                  print('::warning::google-services.json is missing required fields (project_info or client).')
              else:
                  client_list = data.get('client', [])
                  if not client_list or not isinstance(client_list, list):
                      print('::warning::google-services.json contains no client configurations.')
                  else:
                      print('Firebase google-services.json is valid.')
          except Exception as e:
              print(f'::warning::Failed to parse google-services.json: {e}')
          " || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
